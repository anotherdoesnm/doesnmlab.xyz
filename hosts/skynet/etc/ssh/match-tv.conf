
# SFTP only for the TV: no shell, no tunnels, password auth on the LAN.
# Kept as an appended block rather than a sshd_config.d drop-in: Match has to be the
# last section of the file, and Debian includes the drop-in directory at the top.
Match User tv
    ForceCommand internal-sftp
    PasswordAuthentication yes
    PermitTTY no
    AllowTcpForwarding no
    X11Forwarding no
