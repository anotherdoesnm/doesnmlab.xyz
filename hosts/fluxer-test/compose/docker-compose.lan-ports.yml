# Порты для nexus: маршрутизацию делает его nginx, поэтому сервисы CT150 видны в LAN.
# Привязано к статическому адресу CT150 (за границей DHCP-пула), не к 0.0.0.0.
services:
  api:
    ports: ["192.168.1.60:8081:8080"]
  gateway:
    ports: ["192.168.1.60:8082:8080"]
  media-proxy:
    ports: ["192.168.1.60:8083:8080"]
  livekit:
    ports: ["192.168.1.60:8084:7880"]
  admin:
    ports: ["192.168.1.60:8085:8080"]
  static-proxy:
    ports: ["192.168.1.60:8086:8080"]
  app-proxy:
    ports: ["192.168.1.60:8087:8080"]
    environment:
      # edge уходит: манифест берём напрямую у api
      DISCOVERY_UPSTREAM_URL: http://api:8080/.well-known/fluxer
  # edge больше не нужен: маршрутизация ушла в nexus, контейнер держим только
  # как память о прежней схеме — 0 реплик, чтобы `compose up` его не поднимал.
  edge:
    deploy:
      replicas: 0
