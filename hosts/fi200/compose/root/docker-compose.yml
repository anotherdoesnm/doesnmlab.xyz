services:
    db:
       image: postgres:14
       restart: always
       environment:
           - POSTGRES_USER=forgejo
           - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
           - POSTGRES_DB=forgejo
       volumes:
           - ./db:/var/lib/postgresql/data
    forgejo:
       image: codeberg.org/forgejo/forgejo:17
       restart: always
       environment:
          - USER_GID=1000
          - USER_UID=1000
       volumes:
          - ./forgejo-data:/data
       ports:
          - "127.0.0.1:3001:3000"
          - "2222:22"
    forgejo-runner:
       image: data.forgejo.org/forgejo/runner:4.0.0
       restart: always
       volumes:
         - ./forgejo-data/runner:/data
         - /var/run/docker.sock:/var/run/docker.sock
       user: 0:0
       command: 'forgejo-runner daemon'
    gitea-mcp:
       image: gitea/gitea-mcp-server
       restart: always
       ports:
         - "3003:8080"
       environment:
         - GITEA_HOST=http://forgejo:3000
       command: /app/gitea-mcp -t http --port 8080
