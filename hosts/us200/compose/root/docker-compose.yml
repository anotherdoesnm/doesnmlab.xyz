services:
  mumble-server:
   image: mumblevoip/mumble-server:latest
   restart: on-failure
   ports:
     - 64738:64738
     - 64738:64738/udp
   volumes:
     - ./mumble:/data
   environment:
     - MUMBLE_CONFIG_SERVER_PASSWORD=${MUMBLE_CONFIG_SERVER_PASSWORD}
     - MUMBLE_SUPERUSER_PASSWORD=${MUMBLE_SUPERUSER_PASSWORD}
  mqtt:
    image: eclipse-mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - "./mqtt:/mosquitto:Z"
  portainer:
    image: portainer/portainer-ce:lts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer:/data
    ports:
      - 9443:9443
      - 8000:8000
  girafiles:
    image: mattfly/girafiles
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - APP_NAME="Project26 Files"
      - FILE_SIZE_LIMIT=500
      - USERS=veritas:d666bab52c4d0d1bc665cdf4
    volumes:
      - ./files:/tmp/girafiles

