# Pinned on purpose. `capture = auto` happens to pick x11, but the day a driver appears
# it would pick something else and silently change the whole path.
capture = x11
output_name = :0
encoder = software
sw_preset = superfast
sw_tune = zerolatency
address_family = ipv4
origin_web_ui_allowed = lan
# Without these two Sunshine starts the tray, fails, and exits: "Main loop has exited".
system_tray = disabled
notifications = disabled
# The web UI is opened by the LAN address, not by localhost, and Sunshine's CSRF check
# compares origins literally. Without this the pairing PIN is rejected with a red banner.
csrf_allowed_origins = https://192.168.1.62:47990,https://192.168.1.62
