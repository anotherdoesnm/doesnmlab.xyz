# Authoritative DNS for doesnmlab.xyz.
#
# Serves exactly one zone on the public address; the host's own resolver (unbound)
# keeps 127.0.0.1:53, so there is no port conflict.
server:
    rundir: "/run/knot"
    user: knot:knot
    listen: 150.241.64.73@53
    automatic-acl: on

log:
  - target: syslog
    any: info

database:
    storage: "/var/lib/knot"

# DNSSEC: keys live only here. KSK is kept forever (its hash is published as DS at
# the registrar), ZSK rolls on its own every 60 days.
keystore:
  - id: default
    backend: pem
    config: "/var/lib/knot/keys"

policy:
  - id: default
    keystore: default
    algorithm: ecdsap256sha256
    ksk-lifetime: 0
    zsk-lifetime: 60d
    dnskey-ttl: 3600
    zone-max-ttl: 3600
    propagation-delay: 60

zone:
  - domain: doesnmlab.xyz
    file: "/etc/knot/doesnmlab.xyz.zone"
    dnssec-signing: on
    dnssec-policy: default
    zonefile-sync: -1
    journal-content: all
    zonefile-load: difference-no-serial
