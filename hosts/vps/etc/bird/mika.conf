protocol static sob {
    route 212.192.223.99/32 via "lo";
    ipv4;
}
protocol bgp borderfi {
    local 212.192.223.99 as 65115;
    neighbor 38.135.53.105 onlink as 65101;
    interface "sob0";
    hold time 20;
    keepalive time 5;
    direct;
    strict bind yes;

    ipv4 {
        import filter {
            accept;
        };
        export filter {
            if (net ~ 212.192.223.99/32) then accept;
            reject;
        };
    };
};
