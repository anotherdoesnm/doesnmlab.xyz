# DNS management API. Reached from the Traefik container over the docker bridge
# (172.18.0.1 is the host side), and served with the existing wildcard certificate
# — no ACME request, so this keeps working regardless of which server is
# authoritative for the zone.
http:
  routers:
    dns-api:
      rule: "Host(`dns.doesnmlab.xyz`)"
      entryPoints: [websecure]
      service: dns-api
      middlewares: [dns-api-ratelimit]
      tls:
        certResolver: myresolver
    dns-api-redirect:
      rule: "Host(`dns.doesnmlab.xyz`)"
      entryPoints: [web]
      middlewares: [to-https]
      service: dns-api
  middlewares:
    dns-api-ratelimit:
      rateLimit:
        average: 30
        burst: 60
  services:
    dns-api:
      loadBalancer:
        servers: [{ url: "http://172.18.0.1:8088" }]
