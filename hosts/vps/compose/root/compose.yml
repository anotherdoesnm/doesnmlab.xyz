# docker-compose.yml
services:
  traefik:
    image: traefik:v3.7
    restart: always
    env_file:
      - ./desec.env
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.ircsecure.address=:6697"
      # Minecraft speaks raw TCP: no SNI, no Host header. The router lives in
      # /root/traefik/minecraft.yml and points at the frp tunnel, not at a container.
      - "--entrypoints.minecraft.address=:25565"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/traefik"
      # RFC 2136: Knot accepts the _acme-challenge TXT over TSIG. This is the path
      # that keeps certificates working once the zone moves off deSEC.
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=doesnm@project26.cc"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.desec.acme.email=doesnm@project26.cc"
      - "--certificatesresolvers.desec.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.desec.acme.dnschallenge=true"
      - "--certificatesresolvers.desec.acme.dnschallenge.provider=desec"
      - "--certificatesresolvers.desec.acme.dnschallenge.resolvers=1.1.1.1:53"
      # deSEC publishes to its authoritative servers with a delay, so checking instantly
      # always fails even though the record is already accepted.
      - "--certificatesresolvers.desec.acme.dnschallenge.delaybeforecheck=120s"
      # lego's own propagation poll gives up before deSEC has pushed the record to its
      # authoritative servers; Let's Encrypt checks them directly instead.
      - "--certificatesresolvers.desec.acme.dnschallenge.disablePropagationCheck=true"
    ports:
      - "80:80"
      - "443:443"
      - "6697:6697"
      - "25565:25565"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./certs:/letsencrypt
      - ./traefik:/traefik
    networks:
      - traefik_network
  glance:
    image: glanceapp/glance:latest
    restart: always
    container_name: glance
    volumes:
      - ./glance/glance.yml:/app/config/glance.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.glance-https.redirectscheme.scheme=https"
      - "traefik.http.routers.glance.rule=Host(`doesnmlab.xyz`)"
      - "traefik.http.routers.glance.entrypoints=web"
      - "traefik.http.routers.glance.middlewares=glance-https"
      - "traefik.http.routers.glance-secure.rule=Host(`doesnmlab.xyz`)"
      - "traefik.http.routers.glance-secure.entrypoints=websecure"
      - "traefik.http.routers.glance-secure.tls.certresolver=myresolver"
      - "traefik.http.routers.glance-secure.service=glance-service"
      - "traefik.http.services.glance-service.loadbalancer.server.port=8080"
      - "traefik.http.routers.glance-dn42.rule=Host(`doesnm.dn42`)"
      - "traefik.http.routers.glance-dn42.entrypoints=web"
networks:
  traefik_network:
    external: true
