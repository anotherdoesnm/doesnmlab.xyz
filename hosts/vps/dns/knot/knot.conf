# Knot inside the container: paths point at the image's volumes (/config, /rundir,
# /storage), so the same file works on any host running this compose project.
server:
    rundir: "/rundir"
    listen: 150.241.64.73@53
    automatic-acl: on
    user: root

log:
  - target: stdout
    any: info

database:
    storage: "/storage"

keystore:
  - id: default
    backend: pem
    config: "/storage/keys"

policy:
  - id: default
    keystore: default
    algorithm: ecdsap256sha256
    ksk-lifetime: 0
    zsk-lifetime: 60d
    dnskey-ttl: 3600
    zone-max-ttl: 3600
    propagation-delay: 60

zone:
  - domain: doesnmlab.xyz
    file: "/config/doesnmlab.xyz.zone"
    dnssec-signing: on
    dnssec-policy: default
    zonefile-sync: -1
    journal-content: all
    zonefile-load: difference-no-serial
