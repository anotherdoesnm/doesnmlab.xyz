interface=eth0
listen-address=192.168.1.40
bind-interfaces
no-resolv
server=1.1.1.1
server=192.168.1.254

# Subdomains go to YunoHost on nexus; a new YunoHost app needs no change here.
address=/doesnmlab.xyz/192.168.1.10

# The apex needs its own mechanism: dnsmasq 2.90 ignores address=/ap.ex/ for this name
# (a synthetic domain in the same file works, the line is byte-correct), so it lives in
# an additional hosts file. YunoHost serves the apex as a reverse proxy to the VPS.
addn-hosts=/etc/dnsmasq-hosts

# VPS-hosted (Traefik routers or the frp endpoint itself — frpc must not resolve to nexus)
address=/matrix.doesnmlab.xyz/212.192.223.99
address=/auth.doesnmlab.xyz/212.192.223.99
address=/parley.doesnmlab.xyz/212.192.223.99
address=/frp.doesnmlab.xyz/212.192.223.99

# The YunoHost lab (CT 160). dnsmasq address=/d/ matches the domain and
# every subdomain, so this one line covers parley.lab.doesnmlab.xyz too.
address=/lab.doesnmlab.xyz/192.168.1.160
address=/zulip.doesnmlab.xyz/192.168.1.10
address=/mail.doesnmlab.xyz/212.192.223.99
address=/dns.doesnmlab.xyz/150.241.64.73
